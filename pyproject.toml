[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptproof"
version = "1.0.0"
description = "Structure AI video prompts, proof them cheaply at 768P, and only pay for final renders of approved shots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
promptproof = "promptproof.cli:main"

[tool.setuptools.packages.find]
include = ["promptproof*"]
